name: Terraform apply (gated)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type apply to confirm the reviewed deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    if: inputs.confirmation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.13.4"
      - name: Initialize remote state
        run: >-
          terraform -chdir=terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=platformlab.tfstate"
          -backend-config="use_oidc=true"
          -backend-config="use_azuread_auth=true"
      - name: Plan again at deployment time
        run: terraform -chdir=terraform plan -lock-timeout=5m -out=platform.tfplan
      - name: Apply reviewed configuration
        run: terraform -chdir=terraform apply -lock-timeout=5m -auto-approve platform.tfplan
