name: Terraform verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.4"
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform -chdir=terraform init -backend=false
      - name: Validate
        run: terraform -chdir=terraform validate
      - name: TFLint
        run: tflint --chdir=terraform --recursive
      - name: Contract tests
        run: python3 -m unittest discover -s tests -v

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Install Checkov
        run: pip install --disable-pip-version-check checkov
      - name: Checkov policy scan
        run: checkov -d terraform --quiet --compact
